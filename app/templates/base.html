<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}PrimeStride Client OS{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/pipeline-polish.css">
  <link rel="stylesheet" href="/static/v04.css">
  <link rel="stylesheet" href="/static/v05.css">
  <link rel="stylesheet" href="/static/v06.css">
  <link rel="stylesheet" href="/static/v07.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">PS</span>
        <span class="brand-copy"><strong>PrimeStride</strong><small>Client OS</small></span>
      </a>
      <div class="topbar-meta">
        <span class="status-dot"></span>
        <span>Internal workspace</span>
        <span class="version">v0.9</span>
      </div>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
